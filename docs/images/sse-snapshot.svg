<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780">
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/></filter></defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .title { font-size: 30px; font-weight: 700; fill: #111827; }
    .sub { font-size: 15px; fill: #6b7280; }
    .term { font-size: 17px; fill: #e2e8f0; }
    .muted { font-size: 15px; fill: #94a3b8; }
    .accent { fill: #86efac; }
  </style>
  <rect width="1280" height="780" fill="#f8fafc"/>
  <text x="60" y="56" class="title">SSE Streaming Snapshot</text>
  <text x="60" y="84" class="sub">Representative event order from POST /chat/stream</text>
  <rect x="52" y="118" width="1176" height="610" rx="24" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="88" cy="145" r="8" fill="#fb7185"/>
  <circle cx="112" cy="145" r="8" fill="#f59e0b"/>
  <circle cx="136" cy="145" r="8" fill="#34d399"/>
  <text x="170" y="151" class="muted">agent-chat-toolkit demo</text>
  <text x="82" y="190" class="term accent">$ curl -N -X POST https://chat.yearn3.xyz/chat/stream \</text>
  <text x="82" y="216" class="term">  -H &quot;Content-Type: application/json&quot; \</text>
  <text x="82" y="242" class="term">  -d {&quot;message&quot;:&quot;北京天气怎么样？&quot;}</text>
  <text x="82" y="268" class="term"></text>
  <text x="82" y="294" class="term">event: tool_start</text>
  <text x="82" y="320" class="term">data: {&quot;tool&quot;:&quot;fake_weather&quot;,&quot;input&quot;:{&quot;city&quot;:&quot;北京&quot;}}</text>
  <text x="82" y="346" class="term"></text>
  <text x="82" y="372" class="term">event: tool_end</text>
  <text x="82" y="398" class="term">data: {&quot;tool&quot;:&quot;fake_weather&quot;,&quot;output&quot;:{&quot;city&quot;:&quot;北京&quot;,&quot;condition&quot;:&quot;Sunny&quot;,&quot;temperature_c&quot;:26,&quot;humidity&quot;:48},&quot;status&quot;:&quot;success&quot;}</text>
  <text x="82" y="424" class="term"></text>
  <text x="82" y="450" class="term">event: message_delta</text>
  <text x="82" y="476" class="term">data: {&quot;delta&quot;:&quot;北京天气晴朗，气温26摄氏度，湿度48%。&quot;}</text>
  <text x="82" y="502" class="term"></text>
  <text x="82" y="528" class="term">event: final</text>
  <text x="82" y="554" class="term">data: {&quot;response&quot;:{&quot;intent&quot;:&quot;查询天气&quot;,&quot;tool_used&quot;:[&quot;fake_weather&quot;]}}</text>
</svg>