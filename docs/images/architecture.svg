  <text x="310.0" y="521" text-anchor="middle" class="small">messages, tool_calls</text>
  <rect x="470" y="455" width="180" height="82" rx="18" ry="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560.0" y="483" text-anchor="middle" class="label">Static Assets</text>
  <text x="560.0" y="505" text-anchor="middle" class="small">README images</text>
  <text x="560.0" y="521" text-anchor="middle" class="small">and frontend</text>
  <text x="560.0" y="537" text-anchor="middle" class="small">files</text>
  <rect x="700" y="455" width="120" height="82" rx="18" ry="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760.0" y="483" text-anchor="middle" class="label">Nginx</text>
  <text x="760.0" y="505" text-anchor="middle" class="small">HTTPS</text>
  <text x="760.0" y="521" text-anchor="middle" class="small">reverse</text>
  <text x="760.0" y="537" text-anchor="middle" class="small">proxy</text>
