  <rect x="245.5" y="281.0" width="54" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="272.5" y="295.0" text-anchor="middle" class="tiny">route</text>
  <path d="M 460 303 L 495 303" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrowOrange)"/>
  <rect x="445.5" y="281.0" width="64" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="477.5" y="295.0" text-anchor="middle" class="tiny">dispatch</text>
  <path d="M 665 303 L 700 303" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="638.5" y="281.0" width="88" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="682.5" y="295.0" text-anchor="middle" class="tiny">tool schema</text>
  <path d=" M 375 346 L 375 430 L 310 430 L 310 455" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <rect x="315.5" y="408.0" width="54" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="342.5" y="422.0" text-anchor="middle" class="tiny">store</text>
  <path d=" M 580 346 L 580 430 L 310 430" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <rect x="520.0" y="366.0" width="120" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="580.0" y="380.0" text-anchor="middle" class="tiny">todo read/write</text>
  <path d=" M 310 455 L 310 390 L 375 390 L 375 346" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <rect x="314.5" y="368.0" width="56" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="342.5" y="382.0" text-anchor="middle" class="tiny">history</text>
  <path d=" M 760 455 L 760 390 L 785 390 L 785 346" fill="none" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrowOrange)" stroke-dasharray="6 4"/>
  <rect x="724.5" y="368.0" width="96" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="772.5" y="382.0" text-anchor="middle" class="tiny">proxy to app</text>
