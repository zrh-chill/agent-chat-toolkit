  <text x="580.0" y="310" text-anchor="middle" class="small">calculator,</text>
  <text x="580.0" y="326" text-anchor="middle" class="small">todo_create,</text>
  <text x="580.0" y="342" text-anchor="middle" class="small">todo_list,</text>
  <text x="580.0" y="358" text-anchor="middle" class="small">fake_weather</text>
  <rect x="700" y="260" width="170" height="86" rx="18" ry="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="785.0" y="288" text-anchor="middle" class="label">OpenAI-Compatible LLM</text>
  <text x="785.0" y="310" text-anchor="middle" class="small">DashScope or</text>
  <text x="785.0" y="326" text-anchor="middle" class="small">OpenAI Chat</text>
  <text x="785.0" y="342" text-anchor="middle" class="small">Completions</text>
