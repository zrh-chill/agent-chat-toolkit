  <text x="170.0" y="342" text-anchor="middle" class="small">POST</text>
  <text x="170.0" y="358" text-anchor="middle" class="small">/chat/stream</text>
  <rect x="290" y="260" width="170" height="86" rx="18" ry="18" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#shadow)"/>
