  <text x="375.0" y="326" text-anchor="middle" class="small">assembly, tool</text>
  <text x="375.0" y="342" text-anchor="middle" class="small">loop, response</text>
  <text x="375.0" y="358" text-anchor="middle" class="small">validation</text>
