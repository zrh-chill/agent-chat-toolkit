<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; } .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; } .title { font-size: 28px; font-weight: 700; fill: #111827; } .sub { font-size: 13px; fill: #6b7280; } .label { font-size: 14px; font-weight: 600; fill: #111827; } .small { font-size: 12px; fill: #6b7280; } .tiny { font-size: 11px; fill: #6b7280; }</style>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480.0" y="38" text-anchor="middle" class="title">agent-chat-toolkit Project Architecture</text>
  <text x="480" y="62" text-anchor="middle" class="sub">FastAPI backend, manual agent loop, SQLite persistence, SSE streaming and static frontend</text>
  <rect x="50" y="90" width="860" height="110" rx="22" ry="22" fill="none" stroke="#dbe5f1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="68" y="116" class="small" fill="#2563eb">Client Layer</text>
  <rect x="50" y="220" width="860" height="170" rx="22" ry="22" fill="none" stroke="#dbe5f1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="68" y="246" class="small" fill="#2563eb">Application Layer</text>
  <rect x="50" y="410" width="860" height="160" rx="22" ry="22" fill="none" stroke="#dbe5f1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="68" y="436" class="small" fill="#2563eb">Persistence and External Services</text>
  <rect x="95" y="125" width="190" height="56" rx="18" ry="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190.0" y="153" text-anchor="middle" class="label">Browser UI</text>
  <text x="190.0" y="175" text-anchor="middle" class="small">Static index.html</text>
  <text x="190.0" y="191" text-anchor="middle" class="small">chat page</text>
  <rect x="385" y="125" width="190" height="56" rx="18" ry="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480.0" y="153" text-anchor="middle" class="label">REST Client</text>
  <text x="480.0" y="175" text-anchor="middle" class="small">curl / docs / SDK</text>
  <text x="480.0" y="191" text-anchor="middle" class="small">caller</text>
  <rect x="675" y="125" width="190" height="56" rx="18" ry="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770.0" y="153" text-anchor="middle" class="label">SSE Consumer</text>
  <text x="770.0" y="175" text-anchor="middle" class="small">Streaming text</text>
  <text x="770.0" y="191" text-anchor="middle" class="small">and tool events</text>
