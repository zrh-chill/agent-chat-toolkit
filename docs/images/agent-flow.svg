<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
  </defs>
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; } .title { font-size: 28px; font-weight: 700; fill: #111827; } .sub { font-size: 13px; fill: #6b7280; } .label { font-size: 14px; font-weight: 600; fill: #111827; } .small { font-size: 12px; fill: #475569; } .tiny { font-size: 11px; fill: #64748b; }</style>
  <rect width="960" height="760" fill="#ffffff"/>
  <text x="480.0" y="38" text-anchor="middle" class="title">Agent Execution Flow</text>
  <text x="480.0" y="62" text-anchor="middle" class="sub">Finite multi-round tool-calling loop used by POST /chat and POST /chat/stream</text>
  <rect x="320" y="95" width="320" height="68" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480.0" y="123" text-anchor="middle" class="label">Receive Request</text>
  <text x="480.0" y="145" text-anchor="middle" class="small">message + optional</text>
  <text x="480.0" y="161" text-anchor="middle" class="small">conversation_id</text>
  <rect x="320" y="188" width="320" height="68" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480.0" y="216" text-anchor="middle" class="label">Load Context</text>
  <text x="480.0" y="238" text-anchor="middle" class="small">create conversation, load</text>
  <text x="480.0" y="254" text-anchor="middle" class="small">history, save user message</text>
  <rect x="320" y="281" width="320" height="68" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480.0" y="309" text-anchor="middle" class="label">Build Prompt</text>
  <text x="480.0" y="331" text-anchor="middle" class="small">system prompt + history +</text>
  <text x="480.0" y="347" text-anchor="middle" class="small">current user message</text>
  <rect x="320" y="374" width="320" height="68" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480.0" y="402" text-anchor="middle" class="label">Call LLM</text>
  <text x="480.0" y="424" text-anchor="middle" class="small">send messages and tool schema</text>
  <polygon points="480,474 620,534 480,594 340,534" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="529" text-anchor="middle" class="label">Tool calls present?</text>
  <text x="480" y="548" text-anchor="middle" class="small">LLM decides whether to use any tool</text>
  <rect x="690" y="470" width="190" height="72" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="785.0" y="498" text-anchor="middle" class="label">Execute Tool(s)</text>
  <text x="785.0" y="520" text-anchor="middle" class="small">emit tool_start and</text>
  <text x="785.0" y="536" text-anchor="middle" class="small">tool_end events</text>
  <rect x="690" y="572" width="190" height="90" rx="18" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="785.0" y="600" text-anchor="middle" class="label">Append Tool Results</text>
  <text x="785.0" y="622" text-anchor="middle" class="small">store tool log and</text>
  <text x="785.0" y="638" text-anchor="middle" class="small">feed tool output</text>
  <text x="785.0" y="654" text-anchor="middle" class="small">back to LLM</text>
  <rect x="320" y="615" width="320" height="72" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480.0" y="643" text-anchor="middle" class="label">Build Final Response</text>
  <text x="480.0" y="665" text-anchor="middle" class="small">validate AgentResponse and save</text>
  <text x="480.0" y="681" text-anchor="middle" class="small">assistant reply</text>
  <path d="M 480 163 L 480 188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="456.0" y="153.5" width="48" height="18" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="480.0" y="167.5" text-anchor="middle" class="tiny">save</text>
  <path d="M 480 256 L 480 281" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="452.0" y="246.5" width="56" height="18" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="480.0" y="260.5" text-anchor="middle" class="tiny">context</text>
  <path d="M 480 349 L 480 374" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="456.0" y="339.5" width="48" height="18" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="480.0" y="353.5" text-anchor="middle" class="tiny">prompt</text>
  <path d="M 480 442 L 480 474" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="448.0" y="436.0" width="64" height="18" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="480.0" y="450.0" text-anchor="middle" class="tiny">response</text>
  <path d="M 620 534 L 690 506" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrowOrange)"/>
  <rect x="631.0" y="498.0" width="48" height="18" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="655.0" y="512.0" text-anchor="middle" class="tiny">yes</text>
  <path d="M 480 594 L 480 615" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="456.0" y="582.5" width="48" height="18" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="480.0" y="596.5" text-anchor="middle" class="tiny">no</text>
  <path d="M 785 542 L 785 572" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <rect x="761.0" y="535.0" width="48" height="18" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="785.0" y="549.0" text-anchor="middle" class="tiny">run</text>
  <path d="M 690 617 C 620 617 600 617 560 617 C 540 617 528 617 528 594" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrowPurple)"/>
  <rect x="555" y="598" width="138" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="624" y="612" text-anchor="middle" class="tiny">loop to next LLM round</text>
  <path d="M 480 687 L 480 722" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="456.0" y="682.5" width="48" height="18" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="480.0" y="696.5" text-anchor="middle" class="tiny">answer</text>
  <rect x="275" y="717" width="410" height="28" rx="14" fill="#111827" opacity="0.96"/>
  <text x="480" y="736" text-anchor="middle" font-size="13" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">Return JSON or stream message_delta / final events</text>
</svg>