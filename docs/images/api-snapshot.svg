<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1224" width="1280" height="1224">
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/></filter></defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .title { font-size: 30px; font-weight: 700; fill: #111827; }
    .sub { font-size: 15px; fill: #6b7280; }
    .term { font-size: 17px; fill: #e2e8f0; }
    .muted { font-size: 15px; fill: #94a3b8; }
    .accent { fill: #86efac; }
  </style>
  <rect width="1280" height="1224" fill="#f8fafc"/>
  <text x="60" y="56" class="title">API Response Snapshot</text>
  <text x="60" y="84" class="sub">Real response shape from POST /chat with multi-round tool calling</text>
  <rect x="52" y="118" width="1176" height="1054" rx="24" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="88" cy="145" r="8" fill="#fb7185"/>
  <circle cx="112" cy="145" r="8" fill="#f59e0b"/>
  <circle cx="136" cy="145" r="8" fill="#34d399"/>
  <text x="170" y="151" class="muted">agent-chat-toolkit demo</text>
  <text x="82" y="190" class="term accent">$ curl -X POST https://chat.yearn3.xyz/chat \</text>
  <text x="82" y="216" class="term">  -H &quot;Content-Type: application/json&quot; \</text>
  <text x="82" y="242" class="term">  -d {&quot;message&quot;: &quot;帮我计算 235 * 18，然后生成一个待办事项&quot;}</text>
  <text x="82" y="268" class="term"></text>
  <text x="82" y="294" class="term">{</text>
  <text x="82" y="320" class="term">  &quot;answer&quot;: &quot;235 * 18 = 4230，待办事项已创建：计算 235 * 18 = 4230&quot;,</text>
  <text x="82" y="346" class="term">  &quot;intent&quot;: &quot;calculate_and_create_todo&quot;,</text>
  <text x="82" y="372" class="term">  &quot;tool_used&quot;: [</text>
  <text x="82" y="398" class="term">    &quot;calculator&quot;,</text>
  <text x="82" y="424" class="term">    &quot;todo_create&quot;</text>
  <text x="82" y="450" class="term">  ],</text>
  <text x="82" y="476" class="term">  &quot;confidence&quot;: 1.0,</text>
  <text x="82" y="502" class="term">  &quot;tool_calls&quot;: [</text>
  <text x="82" y="528" class="term">    {</text>
  <text x="82" y="554" class="term">      &quot;tool&quot;: &quot;calculator&quot;,</text>
  <text x="82" y="580" class="term">      &quot;input&quot;: {</text>
  <text x="82" y="606" class="term">        &quot;expression&quot;: &quot;235 * 18&quot;</text>
  <text x="82" y="632" class="term">      },</text>
  <text x="82" y="658" class="term">      &quot;output&quot;: {</text>
  <text x="82" y="684" class="term">        &quot;result&quot;: 4230</text>
  <text x="82" y="710" class="term">      },</text>
  <text x="82" y="736" class="term">      &quot;status&quot;: &quot;success&quot;,</text>
  <text x="82" y="762" class="term">      &quot;error&quot;: null</text>
  <text x="82" y="788" class="term">    },</text>
  <text x="82" y="814" class="term">    {</text>
  <text x="82" y="840" class="term">      &quot;tool&quot;: &quot;todo_create&quot;,</text>
  <text x="82" y="866" class="term">      &quot;input&quot;: {</text>
  <text x="82" y="892" class="term">        &quot;title&quot;: &quot;计算 235 * 18 = 4230&quot;</text>
  <text x="82" y="918" class="term">      },</text>
  <text x="82" y="944" class="term">      &quot;output&quot;: {</text>
  <text x="82" y="970" class="term">        &quot;id&quot;: &quot;7deab53c-...&quot;,</text>
  <text x="82" y="996" class="term">        &quot;title&quot;: &quot;计算 235 * 18 = 4230&quot;</text>
  <text x="82" y="1022" class="term">      },</text>
  <text x="82" y="1048" class="term">      &quot;status&quot;: &quot;success&quot;,</text>
  <text x="82" y="1074" class="term">      &quot;error&quot;: null</text>
  <text x="82" y="1100" class="term">    }</text>
  <text x="82" y="1126" class="term">  ],</text>
  <text x="82" y="1152" class="term">  &quot;conversation_id&quot;: &quot;ddcb3d37-...&quot;</text>
  <text x="82" y="1178" class="term">}</text>
</svg>