<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; } .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; } .title { font-size: 28px; font-weight: 700; fill: #111827; } .sub { font-size: 13px; fill: #6b7280; } .label { font-size: 14px; font-weight: 600; fill: #111827; } .small { font-size: 12px; fill: #6b7280; } .tiny { font-size: 11px; fill: #6b7280; }</style>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550.0" y="38" text-anchor="middle" class="title">SQLite Table Design</text>
  <text x="550" y="62" text-anchor="middle" class="sub">Persisted conversation history, assistant replies and tool invocation logs</text>
  <rect x="70" y="140" width="280" height="106" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="140" width="280" height="46" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="210.0" y="169" text-anchor="middle" class="label">conversations</text>
  <text x="92" y="212" class="small">PK  id TEXT</text>
  <text x="92" y="238" class="small">created_at TIMESTAMP</text>
  <rect x="410" y="110" width="300" height="184" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="410" y="110" width="300" height="46" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="560.0" y="139" text-anchor="middle" class="label">messages</text>
  <text x="432" y="182" class="small">PK  id TEXT</text>
  <text x="432" y="208" class="small">FK  conversation_id TEXT</text>
  <text x="432" y="234" class="small">role TEXT</text>
  <text x="432" y="260" class="small">content TEXT</text>
  <text x="432" y="286" class="small">created_at TIMESTAMP</text>
  <rect x="760" y="90" width="280" height="288" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="760" y="90" width="280" height="46" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="900.0" y="119" text-anchor="middle" class="label">tool_calls</text>
  <text x="782" y="162" class="small">PK  id TEXT</text>
  <text x="782" y="188" class="small">FK  conversation_id TEXT</text>
  <text x="782" y="214" class="small">FK  message_id TEXT</text>
  <text x="782" y="240" class="small">tool_name TEXT</text>
  <text x="782" y="266" class="small">tool_input TEXT</text>
  <text x="782" y="292" class="small">tool_output TEXT NULL</text>
  <text x="782" y="318" class="small">status TEXT</text>
  <text x="782" y="344" class="small">error TEXT NULL</text>
  <text x="782" y="370" class="small">created_at TIMESTAMP</text>
  <path d="M 350 205 L 410 205" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="344.0" y="183.0" width="72" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="380.0" y="197.0" text-anchor="middle" class="tiny">1 -&gt; many</text>
  <path d="M 710 188 L 760 188" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="699.0" y="166.0" width="72" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="735.0" y="180.0" text-anchor="middle" class="tiny">1 -&gt; many</text>
  <path d=" M 210 250 L 210 520 L 900 520 L 900 420" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <rect x="371.0" y="498.0" width="368" height="20" rx="8" fill="#ffffff" opacity="0.96"/>
  <text x="555.0" y="512.0" text-anchor="middle" class="tiny">todo_list reads successful todo_create outputs</text>
  <rect x="70" y="420" width="580" height="120" rx="20" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="90" y="448" class="label">Design Notes</text>
  <text x="92" y="476" class="small">• messages stores the full user / assistant conversational timeline in order.</text>
  <text x="92" y="500" class="small">• tool_calls links each tool invocation back to the user message that triggered it.</text>
  <text x="92" y="524" class="small">• todo_list is implemented by reading successful todo_create records from tool_calls.</text>
</svg>